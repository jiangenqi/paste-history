<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<style>
  html, body {
    margin: 0; padding: 0;
    overflow: hidden;
    width: 100vw; height: 100vh;
    background: transparent;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .zz-stage {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease 1.2s;
  }
  .zz-stage.active { opacity: 1; }

  .z {
    position: absolute;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-weight: 800;
    color: rgba(80, 100, 150, 0.9);
    text-shadow: 0 1px 2px rgba(255,255,255,0.5);
    pointer-events: none;
    animation: zDiag 4.5s ease-out infinite;
    opacity: 0;
  }
  .z:nth-child(1) { animation-delay: 0s;   left: 6%;  bottom: 6%;  font-size: 22px; }
  .z:nth-child(2) { animation-delay: 1.5s; left: 6%;  bottom: 6%;  font-size: 28px; }
  .z:nth-child(3) { animation-delay: 3.0s; left: 6%;  bottom: 6%;  font-size: 34px; }

  @keyframes zDiag {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.3) rotate(-6deg); }
    8%   { opacity: 0.85; }
    30%  { opacity: 0.55; transform: translate(calc(45vw - 6vw), calc(-45vh + 6vh)) scale(1.04) rotate(1deg); }
    60%  { opacity: 0.35; transform: translate(calc(65vw - 6vw), calc(-65vh + 6vh)) scale(0.85) rotate(4deg); }
    100% { opacity: 0; transform: translate(calc(82vw - 6vw), calc(-82vh + 6vh)) scale(0.55) rotate(8deg); }
  }
</style>
</head>
<body>

<div class="zz-stage" id="zzStage">
  <span class="z">z</span>
  <span class="z">z</span>
  <span class="z">Z</span>
</div>

<script src="companion.js"></script>
</body>
</html>
