<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>PasteHistory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 主面板 -->
  <div id="mainPanel" class="main-panel">
    <div class="header">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="搜索历史..."
          data-i18n-ph="search.placeholder"
          autocomplete="off"
        />
        <button id="clearSearch" class="clear-btn" title="清除搜索" data-i18n-title="search.clear">✕</button>
      </div>
      <button id="backToMain" class="back-to-main-btn" title="返回全部" data-i18n-title="common.backToAll" data-i18n="common.backToAllText">← 返回</button>
      <button id="orbBtn" class="orb-btn" title="眼球模式" data-i18n-title="eye.title">
        <span class="orb-icon"></span>
      </button>
      <button id="minimizeBtn" class="header-btn minimize-btn" title="最小化" data-i18n-title="common.minimize">─</button>
      <button id="closeWindowBtn" class="header-btn close-header-btn" title="关闭窗口" data-i18n-title="common.close">✕</button>
    </div>

    <!-- 分类标签栏（仅收藏夹模式显示） -->
    <div id="categoryBar" class="category-bar" style="display:none">
      <div id="categoryTabs" class="category-tabs">
        <button class="category-tab active" data-category-id="">全部</button>
      </div>
      <button id="addCategoryBtn" class="category-btn category-add-btn" title="新建分类" data-i18n-title="cat.add">+</button>
      <button id="deleteCategoryBtn" class="category-btn category-del-btn" title="删除选中分类" data-i18n-title="cat.deleteSelected">−</button>
    </div>

    <div id="clipList" class="clip-list">
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <div class="empty-text">还没有复制记录</div>
        <div class="empty-hint">试试复制一段文字或图片</div>
      </div>
    </div>

    <!-- 底部状态栏 -->
    <div class="status-bar">
      <span id="recordCount" class="record-count">共 0 条记录</span>
      <div class="status-actions">
        <button id="refreshBtn" class="status-btn refresh-btn" title="刷新" data-i18n-title="common.refresh">🔄</button>
        <button id="desktopPinBtn" class="status-btn desktop-pin-btn" title="钉在桌面" data-i18n-title="common.desktopPin">📍</button>
        <button id="favoritesBtn" class="status-btn" title="收藏夹" data-i18n-title="common.favorites">📁</button>
        <button id="settingsBtn" class="status-btn" title="设置" data-i18n-title="common.settings">⚙️</button>
      </div>
    </div>
  </div>

  <!-- 设置面板 -->
  <div id="settingsPanel" class="settings-panel">
    <div class="settings-header">
      <button id="backBtn" class="back-btn" title="返回" data-i18n-title="common.back">←</button>
      <span class="settings-title" data-i18n="common.settings">设置</span>
      <div class="settings-header-actions">
        <button id="settingsOrbBtn" class="orb-btn" title="眼球模式" data-i18n-title="eye.title">
          <span class="orb-icon"></span>
        </button>
        <button id="settingsMinimizeBtn" class="header-btn minimize-btn" title="最小化" data-i18n-title="common.minimize">─</button>
        <button id="settingsCloseBtn" class="header-btn close-header-btn" title="关闭窗口" data-i18n-title="common.close">✕</button>
      </div>
    </div>

    <div class="settings-body">
      <!-- ── 通用设置 ── -->
      <div class="setting-group">
        <div class="setting-group-label" data-i18n="settings.groupGeneral">通用</div>
        <!-- 界面语言 -->
        <div class="setting-row">
          <span class="setting-row-label" data-i18n="settings.language">界面语言</span>
          <div class="setting-options" id="languageOptions">
            <button class="option-btn" data-value="zh">中文</button>
            <button class="option-btn" data-value="en">English</button>
          </div>
        </div>
        <div class="setting-divider"></div>
        <!-- 保留期限 -->
        <div class="setting-row setting-row-stacked">
          <span class="setting-row-label" data-i18n="settings.retention">保留期限</span>
          <div class="setting-options" id="retentionOptions">
            <button class="option-btn" data-value="1">1 天</button>
            <button class="option-btn" data-value="3">3 天</button>
            <button class="option-btn" data-value="5">5 天</button>
            <button class="option-btn" data-value="custom">自定义</button>
          </div>
          <div class="custom-retention" id="customRetentionBox" style="display:none">
            <input type="number" id="customDays" class="setting-input custom-days-input" min="1" max="365" placeholder="天数" data-i18n-ph="settings.daysPh" />
            <span class="setting-hint" data-i18n="settings.daysUnit">天</span>
          </div>
        </div>
        <div class="setting-divider"></div>
        <!-- 最大记录数 -->
        <div class="setting-row setting-row-stacked">
          <span class="setting-row-label" data-i18n="settings.maxClips">最大记录数</span>
          <div class="setting-options" id="maxClipsOptions">
            <button class="option-btn" data-value="200">200</button>
            <button class="option-btn" data-value="500">500</button>
            <button class="option-btn" data-value="1000">1000</button>
            <button class="option-btn" data-value="custom">自定义</button>
          </div>
          <div class="custom-retention" id="customMaxClipsBox" style="display:none">
            <input type="number" id="customMaxClips" class="setting-input custom-days-input" min="50" max="10000" placeholder="数量" data-i18n-ph="settings.countPh" />
            <span class="setting-hint" data-i18n="settings.countUnit">条</span>
          </div>
        </div>
      </div>

      <!-- ── 快捷键与启动 ── -->
      <div class="setting-group">
        <div class="setting-group-label" data-i18n="settings.groupShortcut">快捷操作</div>
        <div class="setting-row setting-row-stacked">
          <span class="setting-row-label" data-i18n="settings.shortcut">全局快捷键</span>
          <div class="shortcut-row">
            <div class="shortcut-display" id="shortcutDisplay"></div>
            <input type="text" id="shortcutInput" class="setting-input shortcut-input" readonly placeholder="点击修改" data-i18n-ph="settings.shortcutPh" style="display:none" />
            <button id="recordShortcut" class="option-btn record-btn" data-i18n="settings.change">修改</button>
          </div>
          <div id="shortcutHint" class="setting-hint" style="display:none" data-i18n="settings.shortcutHint">请按下组合键...（如 Ctrl+Shift+V）</div>
        </div>
        <div class="setting-divider"></div>
        <div class="setting-row">
          <span class="setting-row-label" data-i18n="settings.autoLaunch">开机自动启动</span>
          <label class="toggle-switch">
            <input type="checkbox" id="autoLaunchToggle" />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <!-- ── 眼睛模式 ── -->
      <div class="setting-group">
        <div class="setting-group-label" data-i18n="settings.groupEye">眼睛模式</div>
        <div class="setting-row setting-row-stacked">
          <span class="setting-row-label" data-i18n="settings.eyeSize">眼睛大小</span>
          <div class="setting-options" id="eyeSizeOptions">
            <button class="option-btn" data-value="small" data-i18n="settings.small">小</button>
            <button class="option-btn" data-value="medium" data-i18n="settings.medium">中</button>
            <button class="option-btn" data-value="large" data-i18n="settings.large">大</button>
          </div>
        </div>
        <div class="setting-divider"></div>
        <div class="setting-row setting-row-stacked">
          <span class="setting-row-label" data-i18n="settings.eyeIdle">犯困时间</span>
          <div class="setting-options" id="eyeIdleOptions">
            <button class="option-btn" data-value="30">30 秒</button>
            <button class="option-btn" data-value="60">1 分钟</button>
            <button class="option-btn" data-value="120">2 分钟</button>
            <button class="option-btn" data-value="300">5 分钟</button>
            <button class="option-btn" data-value="600">10 分钟</button>
            <button class="option-btn" data-value="custom">自定义</button>
          </div>
          <div class="custom-retention" id="customEyeIdleBox" style="display:none">
            <input type="number" id="customEyeIdle" class="setting-input custom-days-input" min="5" max="3600" placeholder="秒数" data-i18n-ph="settings.secondsPh" />
            <span class="setting-hint" data-i18n="settings.secondsUnit">秒</span>
          </div>
          <span class="setting-hint" style="margin-top:4px" data-i18n="settings.eyeIdleHint">鼠标静止超过此时长后，眼睛逐渐犯困并入睡</span>
        </div>
      </div>

      <!-- ── 数据管理 ── -->
      <div class="setting-group">
        <div class="setting-group-label" data-i18n="settings.groupData">数据</div>
        <div class="setting-row setting-row-stacked">
          <span class="setting-row-label" data-i18n="settings.installDir">安装目录</span>
          <div class="data-dir-row">
            <span id="dataDirPath" class="data-dir-path" data-i18n="common.loading">加载中…</span>
            <button id="copyDataDirBtn" class="setting-row-btn" data-i18n="common.copy">复制</button>
          </div>
        </div>
        <div class="setting-divider"></div>
        <div class="setting-row setting-row-action" id="exportHistoryBtn">
          <span class="setting-row-label" data-i18n="settings.export">导出历史记录</span>
          <span class="setting-row-arrow">›</span>
        </div>
      </div>

      <!-- ── 危险操作 ── -->
      <div class="setting-group">
        <div class="setting-group-label" data-i18n="settings.groupDanger">危险操作</div>
        <div class="setting-row setting-row-action setting-row-danger" id="clearAllBtn">
          <span class="setting-row-label" data-i18n="settings.clearAll">清空所有历史</span>
          <span class="setting-row-arrow">›</span>
        </div>
        <div class="setting-divider"></div>
        <div class="setting-row setting-row-action setting-row-danger" id="uninstallKeepBtn">
          <span class="setting-row-label" data-i18n="settings.uninstall">删除 PasteHistory 程序</span>
          <span class="setting-row-hint" data-i18n="settings.uninstallHint">记录和设置将保留</span>
          <span class="setting-row-arrow">›</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 图片预览遮罩 -->
  <div id="imageOverlay" class="image-overlay">
    <div class="image-overlay-bg"></div>
    <img id="imagePreview" class="image-preview" src="" alt="预览" />
    <button id="closePreview" class="close-preview-btn">✕</button>
  </div>

  <!-- 分类编辑弹窗 -->
  <div id="categoryModal" class="modal-overlay" style="display:none">
    <div class="modal-card" id="modalCard">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle" data-i18n="modal.newCategory">新建分类</span>
        <button id="modalCloseBtn" class="modal-close-btn">✕</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- 创建模式 -->
        <div id="modalCreateBody">
          <input type="text" id="modalNameInput" class="modal-name-input" placeholder="输入分类名称…" data-i18n-ph="modal.namePh" autocomplete="off" tabindex="1" />
          <div id="modalNameError" class="modal-name-error" style="display:none" data-i18n="modal.nameExists">该分类名称已存在</div>
          <div class="modal-clip-label" data-i18n="modal.selectClips">选择要加入的收藏</div>
          <div id="modalClipList" class="modal-clip-list"></div>
        </div>
        <!-- 删除模式 -->
        <div id="modalDeleteBody" style="display:none">
          <div class="modal-clip-label" data-i18n="modal.selectCats">选择要删除的分类</div>
          <div id="modalDeleteList" class="modal-delete-list"></div>
        </div>
      </div>
      <div class="modal-footer" id="modalFooter">
        <button id="modalCancelBtn" class="modal-cancel-btn" data-i18n="common.cancel">取消</button>
        <button id="modalConfirmBtn" class="modal-confirm-btn" disabled data-i18n="modal.create">创建分类</button>
      </div>
    </div>
  </div>

  <!-- 分类右键菜单 -->
  <div id="categoryContextMenu" class="category-context-menu" style="display:none">
    <div class="context-menu-item" data-action="rename" data-i18n="cat.rename">✏️ 重命名</div>
    <div class="context-menu-item danger" data-action="delete" data-i18n="cat.delete">🗑️ 删除</div>
  </div>

  <!-- 复制成功提示 -->
  <div id="copyToast" class="copy-toast" data-i18n="toast.copied">已复制 ✓</div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
